<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just For You 💖</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- ========== CSS ========= -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Merienda', cursive;
        }

        body {
            min-height: 100vh;
            background: url("images/bg.jpg") no-repeat center/cover;
            overflow: hidden;
        }

        body,
        h1,
        h2,
        h3,
        p,
        .btn,
        .aro-btn,
        .final {
            color: #fff;
            text-shadow:
                0 0 2px #000,
                0 0 4px #000,
                0 4px 6px #000;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 26px;
            padding: 44px 30px;
            width: 96%;
            max-width: 600px;
            text-align: center;
            color: #fff;
            animation: fadeUp 1.2s ease;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .hidden {
            display: none;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: .9;
            margin-bottom: 15px;
        }

        .btn {
            margin-top: 25px;
            padding: 14px 36px;
            border-radius: 50px;
            background: linear-gradient(135deg, #7b5fc9, #6ec1ff);
            box-shadow: 0 8px 20px rgba(123, 95, 201, 0.35);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CONFETTI */
        .confetti {
            position: fixed;
            top: -10px;
            width: 8px;
            height: 14px;
            /* BUG FIX 1: was using @keyframes fall (shared with petals, caused conflict).
               Confetti/hearts now use their own dedicated animation. */
            animation: fallDown linear infinite;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        @keyframes fallDown {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .heart {
            position: fixed;
            top: -10px;
            font-size: 20px;
            /* BUG FIX 1 (cont): same fix – use fallDown */
            animation: fallDown linear forwards;
            text-shadow: none;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .final {
            margin-top: 25px;
            opacity: 0;
            transform: translateY(15px);
            transition: 1.2s ease;
        }

        .final.show {
            opacity: 1;
            transform: translateY(0);
        }

        #msg {
            white-space: pre-line;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        #msg.show {
            opacity: 0.95;
            transform: translateY(0);
        }


        /* ============================================
           🎂 RESPONSIVE CAKE
           ============================================ */

        .cake-zone {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 0px;
            margin-bottom: 45px;

            opacity: 0;
            /* BUG FIX 2: was transform: translateY(20px) which conflicted with
               #s4 .cake-zone's transform: translateX(-50%).
               Using opacity-only transition; position stays handled by the #s4 rule. */
            transition: opacity 1.2s ease;
        }

        .cake-zone.show {
            opacity: 1;
        }

        .cake-wrapper {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible;
            padding-bottom: 10px;
        }

        .container {
            position: relative;
            width: 242px;
            height: 270px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
        }

        .bodyCake {
            position: relative;
        }

        .plate {
            position: absolute;
            width: 242px;
            height: 10px;
            border-radius: 10px;
            background-color: #2a9d8f;
        }

        .plate:before {
            content: "";
            position: absolute;
            width: 195px;
            height: 90px;
            background-color: #9c6644;
            top: -90px;
            left: 25px;
        }

        .plate:after {
            content: "";
            position: absolute;
            width: 195px;
            left: 25px;
            background-color: #ffd166;
            top: -60px;
            height: 10px;
            box-shadow: 0px 25px #f4978e;
        }

        .cream {
            position: absolute;
            background-color: #f08080;
            width: 195px;
            height: 20px;
            left: 25px;
            top: -110px;
            border-radius: 20px 20px 0 0;
        }

        .cream:before {
            content: "";
            position: absolute;
            background-color: #f08080;
            width: 15px;
            height: 30px;
            top: 10px;
            left: 0px;
            border-radius: 20px;
            box-shadow: 15px 5px #9c6644,
                30px -5px #f08080,
                45px 0px #9c6644,
                60px 4px #f08080,
                75px 3px #9c6644,
                90px -5px #f08080,
                105px 5px #9c6644,
                120px -5px #f08080,
                135px 0px #9c6644,
                150px 0px #f08080,
                165px 0px #9c6644,
                180px 3px #f08080;
        }

        .cream:after {
            position: absolute;
            content: "";
            background-color: rgba(0, 0, 0, 0.1);
            width: 97.5px;
            height: 110px;
            left: 98px;
            border-radius: 0 20px 0 0;
        }

        .candle {
            position: absolute;
            width: 10px;
            height: 40px;
            background: repeating-linear-gradient(#fae0e4, #fae0e4 5px, #ff0a54 5px, #ff0a54 10px);
            box-shadow: inset -5px 0px rgba(0, 0, 0, 0.1);
            top: -150px;
            left: 118px;
        }

        .candle:before {
            content: "";
            position: absolute;
            background-color: #333;
            width: 2px;
            height: 10px;
            left: 4px;
            top: -10px;
        }

        .candle:after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fcca46;
            border-radius: 80% 15% 55% 50%/ 55% 15% 80% 50%;
            box-shadow: inset -3px 3px #fe7f2d;
            transform: rotate(-45deg);
            top: -28px;
            left: -5px;
            opacity: 0.9;
            animation: scale .5s ease-out infinite;
        }

        @keyframes scale {
            0% {
                transform: scale(1) rotate(-45deg);
                opacity: 0.9;
            }

            40% {
                transform: scale(0.95) rotate(-44deg);
                opacity: 0.85;
            }

            70% {
                transform: scale(1.05) rotate(-46deg);
                opacity: 0.95;
            }

            100% {
                transform: scale(1) rotate(-45deg);
                opacity: 0.9;
            }
        }

        .flame {
            position: absolute;
        }

        .flame:before {
            content: "";
            position: absolute;
            background-color: rgba(0, 0, 0, 0.1);
            height: 10px;
            width: 118px;
            border-radius: 0 10px 10px 0;
            top: 0;
            left: 123px;
        }

        .one {
            position: absolute;
            color: #fcca46;
            font-size: 20px;
            top: -160px;
            left: 100px;
            text-shadow: 33px -30px #fcca46;
            animation: flash .5s ease infinite alternate;
        }

        .two {
            position: absolute;
            color: #fcca46;
            font-size: 15px;
            top: -180px;
            left: 100px;
            text-shadow: 35px 30px #fcca46;
            animation: flash .8s ease infinite alternate;
        }

        .three {
            position: absolute;
            color: #fcca46;
            font-size: 10px;
            top: -195px;
            left: 110px;
            text-shadow: 30px 30px #fcca46;
            animation: flash .4s ease infinite alternate;
        }

        @keyframes flash {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .bodyCake {
            animation: cakeBounce 3.7s ease-in-out infinite;
            transform-origin: center bottom;
        }

        @keyframes cakeBounce {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* RESPONSIVE ADJUSTMENTS FOR CAKE */
        @media (max-width: 768px) {
            .cake-wrapper {
                max-width: 300px;
            }
        }

        @media (max-width: 480px) {
            .cake-wrapper {
                max-width: 250px;
            }
        }

        @media (max-width: 320px) {
            .cake-wrapper {
                max-width: 220px;
            }
        }

        /* Petals */
        .petal {
            position: fixed;
            top: -10%;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #e6ddff, #8a6fd1);
            box-shadow: 0 0 10px rgba(138, 111, 209, 0.4);
            opacity: 0.75;
            border-radius: 50% 50% 50% 0;
            transform: rotate(0deg);
            /* Petals keep their own @keyframes fall – no conflict now */
            animation: fall linear infinite;
            z-index: 2;
            will-change: transform;
            backface-visibility: hidden;
        }

        @keyframes fall {
            0% {
                transform: translateX(0) translateY(0) rotate(0deg);
            }

            100% {
                transform: translateX(80px) translateY(110vh) rotate(360deg);
            }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7b5fc9, #6ec1ff);
            box-shadow: 0 8px 20px rgba(123, 95, 201, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            filter: brightness(1.1);
        }

        .back-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        #s3 h1 {
            font-size: 1.55rem;
            line-height: 1.6;
            font-weight: 500;
        }

        #s3 #typing {
            font-weight: 500;
            letter-spacing: 0.02em;
            word-spacing: 0.08em;
            max-width: 100%;
        }

        .s2-title {
            opacity: 0;
            transform: translateY(25px);
        }

        .s2-title.show {
            animation: s2FadeUp 1.2s ease forwards;
        }

        @keyframes s2FadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== MOBILE TEXT EXTRA BIG ===== */

        @media (max-width: 600px) {
            .card {
                width: 80%;
                max-width: none;
                padding: 22px 20px;
                border-radius: 22px;
                max-height: 75vh;
                overflow-y: auto;
                scrollbar-width: none;
                margin-top: 90px;
            }

            .card::-webkit-scrollbar {
                display: none;
            }

            #s3 h1 {
                font-size: 1.15rem;
                line-height: 1.6;
                font-weight: 500;
            }
        }

        /* 📱 MOBILE HEADING CONTROL – Screen 1, 2, 4 */
        @media (max-width: 600px) {

            #s1 h1,
            #s2 h1,
            #s4 h1 {
                font-size: 1.6rem;
                line-height: 1.3;
            }
        }

        /* ===== TYPING CURSOR – JACARANDA PREMIUM ===== */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            border-radius: 2px;
            margin-left: 4px;
            vertical-align: bottom;
            background: #ae8eff;
            box-shadow:
                0 0 2px #333333,
                0 0 4px #333333,
                0 4px 6px #333333;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.15;
            }

            100% {
                opacity: 1;
            }
        }

        /* ===== CONTINUE BUTTON PREMIUM APPEAR ===== */
        .btn {
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.9s ease, transform 0.9s ease;
        }

        .btn.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* ===== ULTRA BLAST CONFETTI ===== */
        .confetti-explode {
            position: fixed;
            left: 50%;
            top: 50%;
            pointer-events: none;
            transform: translate3d(-50%, -50%, 0);
            will-change: transform;
            backface-visibility: hidden;
            animation: explode 1.8s cubic-bezier(.12, .72, .38, 1) forwards;
            text-shadow:
                0 0 8px rgba(255, 236, 113, 0.6),
                0 0 18px rgba(255, 236, 113, 0.6);
        }

        @keyframes explode {
            from {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 1;
            }

            to {
                transform:
                    translate(calc(-50% + var(--x)),
                        calc(-50% + var(--y))) rotate(var(--r));
                opacity: 0.5;
            }
        }

        /* ===== SUBTLE SCREEN SHAKE ===== */
        @keyframes subtleShake {
            0% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(-3px, 2px);
            }

            40% {
                transform: translate(3px, -2px);
            }

            60% {
                transform: translate(-2px, 1px);
            }

            80% {
                transform: translate(2px, -1px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        .shake {
            animation: subtleShake 0.25s ease;
        }

        /* ===== FADE-IN LETTERS FOR TYPING TEXT ===== */
        .fade-letter {
            opacity: 0;
            display: inline;
            animation: fadeInLetter 0.7s forwards;
            backface-visibility: hidden;
        }

        @keyframes fadeInLetter {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ===== SCREEN 1 PARAGRAPH SOFT FADE-IN ===== */
        .s1-fade {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1.4s ease, transform 1.4s ease;
        }

        .s1-fade.show {
            opacity: 0.95;
            transform: translateY(0);
        }

        /* 🎂 SCREEN 4 – OLD CAKE JESA TOP SPACING */
        #s4.card {
            padding-top: 0px !important;
            position: relative;
        }

        /* 🎂 FORCE CAKE TO STICK TO TOP GLASS EDGE */
        #s4 .cake-zone {
            position: absolute;
            top: -80px;
            left: 50%;
            /* BUG FIX 2 (cont): translateX(-50%) preserved here without
               translateY conflict since .cake-zone.show no longer sets transform */
            transform: translateX(-50%);
            margin: 0 !important;
            padding: 0 !important;
            z-index: 5;
        }

        #s4 h1 {
            margin-top: 280px;
        }

        /* BUG FIX 3 (mobile): on small screens cake at top:-80px can overflow
           the card edge and get clipped. Pull the card down slightly on mobile
           so the cake has breathing room above it. */
        @media (max-width: 600px) {
            #s4.card {
                margin-top: 140px !important;
            }
        }
    </style>

</head>

<body>

    <!-- ========== HTML ========= -->

    <audio id="music" loop>
        <source src="music/music.mp3" type="audio/mpeg">
    </audio>

    <audio id="blastSound">
        <source src="music/blast.mp3" type="audio/mpeg">
    </audio>

    <div class="overlay">

        <button class="back-btn aro-btn" onclick="prev()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <!-- ========== SCREEN 1 ========== -->

        <div class="card" id="s1">

            <h1 class="s2-title">
                Something Special Awaits 🌸
            </h1>

            <p class="s1-fade">
                Tap gently… I've poured a little piece of my heart into a small effort to create something truly special
                just for you 💖
            </p>

            <div class="btn" onclick="next(2)">
                Tap to Continue
            </div>

        </div>

        <!-- ========== SCREEN 2 ========== -->

        <div class="card hidden" id="s2">

            <h1 class="s2-title">
                Happy Birthday Taiba 🎂
            </h1>

            <p class="type-s2"
                data-text="You're one of those rare people who makes life brighter just by being in it. You're amazing exactly as you are, and you deserve all the happiness and love the world can give 🌸">
            </p>

            <div class="btn" onclick="next(3)">
                Tap to Continue
            </div>

        </div>

        <!-- ========== SCREEN 3 ========== -->

        <div class="card hidden" id="s3">

            <h1 id="typing"> </h1>

            <div class="btn" onclick="next(4)">
                Tap to Continue
            </div>

        </div>

        <!-- ========== SCREEN 4 ========== -->

        <div class="card hidden" id="s4">

            <div class="cake-zone">
                <div class="cake-wrapper">
                    <div class="container">
                        <div class="bodyCake">
                            <div class="plate"></div>
                            <div class="cream"></div>
                            <div class="candle"></div>
                            <div class="flame">
                                <div class="one">+</div>
                                <div class="two">+</div>
                                <div class="three">+</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <h1 class="s2-title">
                Make a Wish 🎂
            </h1>

            <p id="msg" data-text=""></p>

            <p class="final" id="final"></p>

        </div>

    </div>

    <!-- ========== JAVASCRIPT ========= -->

    <script>

        const name = "Taiba";
        const music = document.getElementById("music");
        const typing = document.getElementById("typing");
        const text = `May ALLAH bless you with endless joy, love, and success 💖✨. May every step you take be guided with happiness 🌸, every dream you hold turn into reality and may your heart always be filled with peace, laughter, and beautiful moments. May  this year bring you new adventures, sweet memories, and countless reasons to smile. Happy Birthday to someone truly special 🎉🎂💖`;
        const final = document.getElementById("final");

        let i = 0;
        let currentScreen = 1;
        let typingTimeout;
        let paraTimeouts = [];
        // BUG FIX 4: finalTimeout now stores interval IDs so they can actually be cleared
        let confettiInterval = null;
        let heartInterval = null;
        let musicStarted = false;

        // ===== TYPING RUN-ONCE FLAGS =====
        let s2Typed = false;
        let s3Typed = false;
        let s4Typed = false;

        // ===== SAFE PARAGRAPH TYPING SYSTEM =====
        function clearParagraphTyping() {
            paraTimeouts.forEach(t => clearTimeout(t));
            paraTimeouts = [];
        }

        function typeParagraphsOneByOne(elements, speed = 45, onComplete = null) {

            clearParagraphTyping();
            let pIndex = 0;

            function typeNextParagraph() {
                if (pIndex >= elements.length) {
                    if (onComplete) onComplete();
                    return;
                }

                const el = elements[pIndex];
                const fullText = el.getAttribute("data-text");

                const chars = Array.from(fullText);

                el.innerHTML = '<span class="text"></span><span class="cursor"></span>';

                let charIndex = 0;

                function typeChar() {

                    const char = chars[charIndex];
                    const span = document.createElement("span");
                    span.textContent = char;
                    span.classList.add("fade-letter");
                    el.querySelector(".text").appendChild(span);
                    charIndex++;


                    if (charIndex < chars.length) {
                        paraTimeouts.push(setTimeout(typeChar, speed));
                    } else {
                        const cursor = el.querySelector(".cursor");

                        if (cursor) {
                            cursor.style.opacity = "0";
                            cursor.style.boxShadow = "0 0 20px rgba(138,111,209,0.9)";
                            setTimeout(() => cursor.remove(), 800);
                        }
                        pIndex++;
                        paraTimeouts.push(setTimeout(typeNextParagraph, 300));
                    }
                }
                typeChar();
            }
            typeNextParagraph();
        }

        function resetTypedParagraphs(selector) {
            document.querySelectorAll(selector).forEach(p => {
                p.innerHTML = "";
            });
        }

        function typeText(onComplete) {
            if (typingTimeout) clearTimeout(typingTimeout);

            let index = 0;

            const chars = Array.from(text);

            typing.innerHTML = '<span class="text"></span><span class="cursor"></span>';

            const textSpan = typing.querySelector(".text");
            const cursor = typing.querySelector(".cursor");

            function write() {

                const char = chars[index];
                const span = document.createElement("span");

                span.textContent = char;
                span.classList.add("fade-letter");
                textSpan.appendChild(span);
                index++;


                if (index < chars.length) {
                    let delay = 45; // Fixed speed, no randomness
                    typingTimeout = setTimeout(write, delay);
                } else {
                    setTimeout(() => {
                        cursor.style.boxShadow = "0 0 22px rgba(138,111,209,1)";
                        cursor.style.opacity = "0";
                    }, 400);

                    // button thora jaldi
                    setTimeout(() => {
                        if (onComplete) onComplete();
                    }, 700);

                    // cursor thora baad me clean ho
                    setTimeout(() => {
                        cursor.remove();
                    }, 1200);

                }
            }
            write();
        }


        function fadeSequence({ title, paragraph, button }) {

            // reset
            title.classList.remove("show");
            paragraph.classList.remove("show");
            button.classList.remove("show");

            // h fade in
            setTimeout(() => {
                title.classList.add("show");

                // p fade in
                setTimeout(() => {
                    paragraph.classList.add("show");

                    // btn show
                    setTimeout(() => {
                        button.classList.add("show");
                    }, 800);

                }, 800);

            }, 100);
        }


        function next(n) {

            document.querySelectorAll(".confetti, .heart").forEach(e => e.remove());

            document.querySelectorAll("#s" + n + " .btn").forEach(b => {
                b.classList.remove("show");
            });

            document.querySelectorAll(".card").forEach(c => c.classList.add("hidden"));

            document.getElementById("s" + n).classList.remove("hidden");

            currentScreen = n;

            if (typingTimeout) clearTimeout(typingTimeout);

            if (n === 1) {

                const title = document.querySelector("#s1 .s2-title");
                const para = document.querySelector("#s1 .s1-fade");
                const btn = document.querySelector("#s1 .btn");

                title.classList.remove("show");
                para.classList.remove("show");
                btn.classList.remove("show");

                setTimeout(() => {

                    title.classList.add("show");

                    setTimeout(() => {
                        para.classList.add("show");
                    }, 800);

                    setTimeout(() => {
                        btn.classList.add("show");
                    }, 1600);

                }, 100);
            }

            if (n === 2) {
                const title = document.querySelector("#s2 .s2-title");

                if (!s2Typed) {

                    clearParagraphTyping();
                    resetTypedParagraphs(".type-s2");
                    title.classList.remove("show");
                    document.querySelector("#s2 .btn").classList.remove("show");

                    setTimeout(() => {

                        title.classList.add("show");

                        setTimeout(() => {

                            BUTTERY_MEGA_BLAST();

                            if (!musicStarted) {
                                setTimeout(() => {
                                    music.volume = 0.5;
                                    music.play().catch(() => { });
                                    musicStarted = true;
                                }, 2800);
                            }

                            setTimeout(() => {
                                typeParagraphsOneByOne(
                                    document.querySelectorAll(".type-s2"),
                                    45,
                                    () => {
                                        document.querySelector("#s2 .btn").classList.add("show");
                                    }
                                );
                            }, 5000);

                        }, 1200);

                    }, 100);

                    s2Typed = true;

                } else {

                    // typing dobara nahi
                    document.querySelectorAll(".type-s2").forEach(p => {
                        p.textContent = p.getAttribute("data-text");
                        p.classList.add("s1-fade"); // reuse fade style
                    });

                    fadeSequence({
                        title: title,
                        paragraph: document.querySelector(".type-s2"),
                        button: document.querySelector("#s2 .btn")
                    });
                }

            }

            if (n === 3) {

                if (!s3Typed) {
                    typing.innerHTML = "";

                    setTimeout(() => {
                        typeText(() => {
                            document.querySelector("#s3 .btn").classList.add("show");
                        });
                        s3Typed = true;
                    }, 150);

                } else {

                    typing.textContent = text;
                    typing.classList.add("s1-fade");

                    fadeSequence({
                        title: document.querySelector("#s3 h1"),
                        paragraph: typing,
                        button: document.querySelector("#s3 .btn")
                    });
                }

            }

            if (n === 4) {

                const title = document.querySelector("#s4 .s2-title");

                const cake = document.querySelector("#s4 .cake-zone");
                cake.classList.remove("show");
                const msg = document.getElementById("msg");
                const final = document.getElementById("final");

                // STEP A: sab kuch chupa do (card blank feel)
                cake.classList.remove("show");
                title.classList.remove("show");
                msg.classList.remove("show");
                final.classList.remove("show");

                // ===== RESET (safe & simple) =====
                title.classList.remove("show");
                msg.classList.remove("show");
                final.classList.remove("show");

                // text hamesha ready rakho
                msg.setAttribute(
                    "data-text",
                    `Dear ${name}, 💖 You are loved more than words can say. Close your eyes and make a wish ✨`
                );

                final.textContent = `This was made just for you, ${name} 💖`;

                // ===== STEP 0: CAKE FIRST =====

                // STEP 1: thora wait, phir cake
                setTimeout(() => {

                    cake.classList.add("show"); // cake fade-in

                    // STEP 2: cake ke baad thora wait
                    setTimeout(() => {

                        // STEP 3: heading
                        title.classList.add("show");

                        // STEP 4: typing (first time)
                        if (!s4Typed) {

                            msg.innerHTML = "";

                            setTimeout(() => {

                                typeParagraphsOneByOne([msg], 45, () => {

                                    setTimeout(() => {
                                        final.classList.add("show");
                                    }, 700);

                                });

                                msg.classList.add("show");
                                s4Typed = true;

                            }, 800);

                        }
                        // STEP 5: second time (no typing)
                        else {

                            msg.textContent = msg.getAttribute("data-text");

                            setTimeout(() => {
                                msg.classList.add("show");

                                setTimeout(() => {
                                    final.classList.add("show");
                                }, 700);

                            }, 800);
                        }

                    }, 1500); // cake ke baad ka wait

                }, 1000); // card ke baad cake ka wait

                finale();
            }

            updateBackButton();
        }

        function prev() {

            if (currentScreen > 1) {
                next(currentScreen - 1);
            }

        }

        let touchStartX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true }); // BUG FIX 5: passive listener for better mobile scroll performance

        document.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX - touchStartX > 80) {
                prev();
            }
        }, { passive: true }); // BUG FIX 5 (cont)

        function updateBackButton() {
            const btn = document.querySelector(".back-btn");
            if (currentScreen === 1) {
                btn.style.display = "none";
            } else {
                btn.style.display = "flex";
            }
        }

        function finale() {

            // BUG FIX 4: properly clear previous intervals before starting new ones
            if (confettiInterval) clearInterval(confettiInterval);
            if (heartInterval) clearInterval(heartInterval);

            confettiInterval = setInterval(confetti, 500);
            heartInterval = setInterval(heart, 700);

            setTimeout(() => {
                clearInterval(confettiInterval);
                clearInterval(heartInterval);
                confettiInterval = null;
                heartInterval = null;
            }, 10000);
        }


        // ===== ULTRA OPTIMIZED: Confetti with Batched Styles =====
        function confetti() {
            const c = document.createElement("div");
            c.className = "confetti";

            const symbols = ["❤️", "✨"];
            const chosenSymbol = symbols[Math.random() < 0.5 ? 0 : 1];

            let size = chosenSymbol === "❤️" ? (12 + Math.random() * 6) : (18 + Math.random() * 6);

            c.style.cssText = `
                left: ${Math.random() * 100}vw;
                font-size: ${size}px;
                opacity: ${0.5 + Math.random() * 0.5};
                animation-duration: ${3 + Math.random() * 2}s;
                transform: rotate(${Math.random() * 360}deg);
            `;

            c.innerText = chosenSymbol;
            document.body.appendChild(c);

            setTimeout(() => c.style.opacity = 0, 3000);
            setTimeout(() => c.remove(), 6000);
        }

        // ===== ULTRA OPTIMIZED: Heart with Batched Styles =====
        function heart() {
            const h = document.createElement("div");
            h.className = "heart";
            h.innerText = "❤️";

            h.style.cssText = `
                left: ${Math.random() * 100}vw;
                font-size: ${16 + Math.random() * 12}px;
                animation-duration: ${3 + Math.random() * 2}s;
            `;

            document.body.appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }

        // ===== ULTRA OPTIMIZED: Petal with Batched Styles =====
        function createPetal() {
            const petal = document.createElement("div");
            petal.className = "petal";

            const size = 10 + Math.random() * 8;

            petal.style.cssText = `
                left: ${Math.random() * window.innerWidth}px;
                width: ${size}px;
                height: ${size}px;
                animation-duration: ${6 + Math.random() * 6}s;
            `;

            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
                petalCount--;
            }, 12000);
        }

        function playBlastSound() {
            const sound = document.getElementById("blastSound");
            if (!sound) return;
            sound.currentTime = 0;
            sound.volume = 0.45;
            sound.play().catch(() => { });
        }

        function screenShake() {
            const overlay = document.querySelector(".overlay");
            if (!overlay) return;

            overlay.classList.add("shake");

            setTimeout(() => {
                overlay.classList.remove("shake");
            }, 300);
        }

        // ===== ULTRA OPTIMIZED: Blast with Fewer Particles =====
        function BUTTERY_MEGA_BLAST() {

            playBlastSound();
            screenShake();

            const symbols = ["✨", "💜", "🎉", "🎊", "💫", "💖"];

            const TOTAL_PARTICLES = 280;
            const DURATION = 1600;
            const PER_FRAME = 2;

            let created = 0;
            let startTime = null;

            function spawnFrame(timestamp) {
                if (!startTime) startTime = timestamp;

                const elapsed = timestamp - startTime;

                if (created >= TOTAL_PARTICLES || elapsed > DURATION) return;

                for (let i = 0; i < PER_FRAME; i++) {
                    createOneBlastParticle(symbols);
                    created++;
                    if (created >= TOTAL_PARTICLES) break;
                }

                requestAnimationFrame(spawnFrame);
            }

            requestAnimationFrame(spawnFrame);
        }

        function createOneBlastParticle(symbols) {
            const p = document.createElement("div");
            p.className = "confetti-explode";

            p.innerText = symbols[Math.floor(Math.random() * symbols.length)];

            p.style.fontSize = 14 + Math.random() * 18 + "px";

            const angle = Math.random() * Math.PI * 2;
            const power = 180 + Math.random() * 280;

            const x = Math.cos(angle) * power;
            const y = Math.sin(angle) * power;

            p.style.setProperty("--x", `${x}px`);
            p.style.setProperty("--y", `${y}px`);
            p.style.setProperty("--r", `${Math.random() * 720}deg`);

            document.body.appendChild(p);

            setTimeout(() => p.remove(), 1600);
        }

        // ===== PERFECTLY BALANCED: Beautiful Petals =====
        let petalCount = 0;
        const MAX_PETALS = 20;

        setInterval(() => {
            if (petalCount < MAX_PETALS) {
                createPetal();
                petalCount++;
            }
        }, 350);

        next(1);

    </script>
    

</body>
